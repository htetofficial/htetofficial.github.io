<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131A"/>
      <stop offset="50%" stop-color="#231628"/>
      <stop offset="100%" stop-color="#120E16"/>
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5BCEFA"/>
      <stop offset="50%" stop-color="#F5A9B8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle decorative borders -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#4A3052" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <rect x="45" y="45" width="1110" height="540" rx="16" fill="none" stroke="#F5A9B8" stroke-width="1" opacity="0.2"/>

  <!-- Top Badges -->
  <rect x="80" y="75" width="280" height="38" rx="19" fill="url(#roseGrad)"/>
  <text x="220" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PERSONAL ESSAY</text>

  <rect x="375" y="75" width="320" height="38" rx="19" fill="#2A1D30" stroke="#5C3D66" stroke-width="1"/>
  <text x="535" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F5A9B8" text-anchor="middle" letter-spacing="1">INTERSECTIONAL FEMINISM</text>

  <rect x="710" y="75" width="180" height="38" rx="19" fill="#201625" stroke="#42294A" stroke-width="1"/>
  <text x="800" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">MAY 22, 2026</text>

  <!-- Title (Burmese) -->
  <text x="80" y="185" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    အစွန်းတစ်ဖက်က Transwoman တစ်ယောက်၏ ရင်ဖွင့်သံ
  </text>
  <text x="80" y="235" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="24" font-weight="600" fill="#F5A9B8">
    "အမျိုးသမီးအရေး လှုပ်ရှားနေရင်း ပုံမှန်ဘဝလေးတွေကို ထက် မနာလိုဖြစ်မိတယ်"
  </text>

  <!-- English Subtitle -->
  <text x="80" y="285" font-family="'Georgia', 'Times New Roman', serif" font-size="21" font-style="italic" fill="#CBD5E1">
    From the Margins of Womanhood: A Trans Activist's Confession on Feminism, Envy, and Unhoused Nights
  </text>

  <!-- Quote Box / Key Excerpt -->
  <rect x="80" y="325" width="1040" height="155" rx="16" fill="#1E1423" stroke="#E11D48" stroke-width="1.5" opacity="0.95"/>
  <rect x="80" y="325" width="8" height="155" rx="4" fill="#F5A9B8"/>
  
  <text x="110" y="365" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="17" fill="#F1F5F9" font-weight="500">
    "အဆောင်တစ်ခုရှာဖို့ဆိုတာ ထက်တို့အတွက် ငရဲခန်းတစ်ခုလိုပါပဲ။ မိန်းကလေးအဆောင်သွားရင် 'မင်းက ယောက်ျားပဲ' လို့
  </text>
  <text x="110" y="395" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="17" fill="#F1F5F9" font-weight="500">
    တံခါးပိတ်ခံရတယ်၊ ယောက်ျားလေးအဆောင်သွားပြန်တော့လည်း 'မင်းက မိန်းကလေးလို ဖြစ်နေတာ' ဆိုပြီး ငြင်းပယ်ကြတယ်..."
  </text>
  <text x="110" y="435" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="15" fill="#94A3B8">
    — ထက်မနာလိုဖြစ်မိတာက သူတို့ကိုမုန်းလို့မဟုတ်ပါဘူး၊ ကိုယ်တိုင်တောင့်တပြီး တစ်ခါမှမရခဲ့ဖူးတဲ့ 'နွေးထွေးမှု' လေးတွေကို မြင်နေရလို့ပါ
  </text>

  <!-- Bottom Metadata Row -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="340" height="50" rx="25" fill="#2A1D30" stroke="#5C3D66" stroke-width="1"/>
    <circle cx="25" cy="25" r="16" fill="#E11D48"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="52" y="24" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">ထက်မြတ်ဧကရီ (Htet)</text>
    <text x="52" y="41" font-family="sans-serif" font-size="11" fill="#CBD5E1">Feminist Activist &amp; Writer</text>

    <!-- Trans Colors Strip -->
    <g transform="translate(360, 15)">
      <rect x="0" y="0" width="30" height="20" rx="4" fill="#5BCEFA"/>
      <rect x="35" y="0" width="30" height="20" rx="4" fill="#F5A9B8"/>
      <rect x="70" y="0" width="30" height="20" rx="4" fill="#FFFFFF"/>
      <rect x="105" y="0" width="30" height="20" rx="4" fill="#F5A9B8"/>
      <rect x="140" y="0" width="30" height="20" rx="4" fill="#5BCEFA"/>
      <text x="185" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F5A9B8">TRANS RIGHTS ARE HUMAN RIGHTS</text>
    </g>

    <!-- Hanko Stamp / Seal -->
    <g transform="translate(960, -5)">
      <rect x="0" y="0" width="80" height="60" rx="10" fill="none" stroke="#E11D48" stroke-width="2.5" opacity="0.9"/>
      <rect x="4" y="4" width="72" height="52" rx="7" fill="none" stroke="#E11D48" stroke-width="1" opacity="0.6"/>
      <text x="40" y="26" font-family="'Pyidaungsu', sans-serif" font-size="13" font-weight="bold" fill="#E11D48" text-anchor="middle">ရင်ဖွင့်</text>
      <text x="40" y="46" font-family="'Pyidaungsu', sans-serif" font-size="13" font-weight="bold" fill="#E11D48" text-anchor="middle">ဆောင်းပါး</text>
    </g>
  </g>
</svg>