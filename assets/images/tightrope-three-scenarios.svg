<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Three Potential Future Scenarios for Myanmar and the Sovereign Path Forward">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F21"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1B1626"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#272011"/>
      <stop offset="100%" stop-color="#15211B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#scBg)"/>
  <rect x="14" y="14" width="972" height="532" rx="12" fill="none" stroke="#F59E0B" stroke-opacity="0.32" stroke-width="1.2"/>

  <!-- Header -->
  <text x="42" y="50" font-family="ui-monospace, monospace" font-size="11.5" font-weight="bold" letter-spacing="2" fill="#FDE68A">FIGURE 05 • STRATEGIC FORESIGHT &amp; SOVEREIGN COMPASS</text>
  <text x="42" y="82" font-family="Pyidaungsu, sans-serif" font-size="22" font-weight="bold" fill="#FFFBEB">မြန်မာနိုင်ငံအတွက် ဖြစ်နိုင်ခြေရှိသော အနာဂတ်အခြေအနေ (၃) ရပ် နှိုင်းယှဉ်ပုံ</text>
  <text x="42" y="106" font-family="Georgia, serif" font-size="13.5" font-style="italic" fill="#CBD5E1">Strategic Crossroads: Avoiding External Proxy Dependency &amp; Securing Sovereign Self-Determination</text>
  <line x1="42" y1="122" x2="958" y2="122" stroke="#F59E0B" stroke-opacity="0.32"/>

  <!-- Three Scenario Columns -->
  <!-- Scenario 1 -->
  <g transform="translate(42, 146)">
    <rect x="0" y="0" width="290" height="316" rx="14" fill="#1F1218" stroke="#EF4444" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="7" rx="3" fill="#DC2626"/>
    <rect x="20" y="24" width="112" height="24" rx="12" fill="#DC2626" fill-opacity="0.22" stroke="#EF4444" stroke-opacity="0.6"/>
    <text x="76" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold" fill="#FCA5A5">SCENARIO 01</text>
    <text x="20" y="76" font-family="Pyidaungsu, sans-serif" font-size="16" font-weight="bold" fill="#FEE2E2">ပထမအခြေအနေ</text>
    <text x="20" y="99" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#FCA5A5">တစ်ဖက်စောင်းနင်း မှီခိုမှုနှင့်</text>
    <text x="20" y="117" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#FCA5A5">ပြည်ပသြဇာ လွှမ်းမိုးခံရခြင်း</text>
    <line x1="20" y1="134" x2="270" y2="134" stroke="#EF4444" stroke-opacity="0.28"/>
    <text x="20" y="160" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">• စီးပွားရေးနှင့် လုံခြုံရေးတွင်</text>
    <text x="28" y="178" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">အင်အားကြီးတစ်နိုင်ငံအပေါ် မှီခို</text>
    <text x="20" y="206" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">• သဘာဝသယံဇာတနှင့် စင်္ကြံများ</text>
    <text x="28" y="224" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">တန်းတူမှုမရှိဘဲ ဆုံးရှုံးနိုင်ခြေ</text>
    <rect x="20" y="254" width="250" height="42" rx="8" fill="#7F1D1D" fill-opacity="0.45"/>
    <text x="145" y="279" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="12" font-weight="bold" fill="#FECACA">အန္တရာယ် — အချုပ်အခြာအာဏာ ကျုံ့ဝင်</text>
  </g>

  <!-- Scenario 2 -->
  <g transform="translate(355, 146)">
    <rect x="0" y="0" width="290" height="316" rx="14" fill="#161C2C" stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="7" rx="3" fill="#64748B"/>
    <rect x="20" y="24" width="112" height="24" rx="12" fill="#64748B" fill-opacity="0.24" stroke="#94A3B8" stroke-opacity="0.6"/>
    <text x="76" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold" fill="#CBD5E1">SCENARIO 02</text>
    <text x="20" y="76" font-family="Pyidaungsu, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">ဒုတိယအခြေအနေ</text>
    <text x="20" y="99" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#CBD5E1">ကာလရှည် မတည်ငြိမ်မှုနှင့်</text>
    <text x="20" y="117" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#CBD5E1">အင်အားပြိုင်ဆိုင်ရာ ကြားခံနယ်မြေ</text>
    <line x1="20" y1="134" x2="270" y2="134" stroke="#94A3B8" stroke-opacity="0.28"/>
    <text x="20" y="160" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">• ပြည်တွင်းပဋိပက္ခ ရှည်ကြာပြီး</text>
    <text x="28" y="178" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">အစိတ်စိတ်အမြွှာမြွှာ ကွဲပြားမှု</text>
    <text x="20" y="206" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">• ပြည်ပအင်အားစုများ၏ ကြားခံ</text>
    <text x="28" y="224" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#E2E8F0">အားပြိုင်ရာ ဇုန်ဖြစ်လာခြင်း</text>
    <rect x="20" y="254" width="250" height="42" rx="8" fill="#334155" fill-opacity="0.65"/>
    <text x="145" y="279" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">သတိပြုရန် — လူသားချင်းစာနာမှု အကျပ်အတည်း</text>
  </g>

  <!-- Scenario 3 (Recommended Sovereign Path) -->
  <g transform="translate(668, 146)">
    <rect x="0" y="0" width="290" height="316" rx="14" fill="url(#goldHighlight)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="290" height="7" rx="3" fill="#F59E0B"/>
    <rect x="20" y="24" width="160" height="24" rx="12" fill="#F59E0B" fill-opacity="0.22" stroke="#F59E0B"/>
    <text x="100" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold" fill="#FDE68A">SCENARIO 03 ★ GOAL</text>
    <text x="20" y="76" font-family="Pyidaungsu, sans-serif" font-size="16" font-weight="bold" fill="#FFFBEB">တတိယအခြေအနေ</text>
    <text x="20" y="99" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#FDE68A">ဖက်ဒရယ်ဒီမိုကရေစီနှင့်</text>
    <text x="20" y="117" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#FDE68A">ကိုယ်ပိုင်အချုပ်အခြာအာဏာ ရပ်တည်မှု</text>
    <line x1="20" y1="134" x2="270" y2="134" stroke="#F59E0B" stroke-opacity="0.35"/>
    <text x="20" y="160" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#FEF3C7">• ပြည်တွင်းညီညွတ်ရေးနှင့် အားလုံး</text>
    <text x="28" y="178" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#FEF3C7">ပါဝင်သော နိုင်ငံရေးအဖြေရှာမှု</text>
    <text x="20" y="206" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#FEF3C7">• တရုတ်၊ အမေရိကန်၊ အိန္ဒိယ၊ ASEAN</text>
    <text x="28" y="224" font-family="Pyidaungsu, sans-serif" font-size="12" fill="#FEF3C7">တို့နှင့် တန်းတူချိန်ညှိ ဆက်ဆံရေး</text>
    <rect x="20" y="254" width="250" height="42" rx="8" fill="#065F46" fill-opacity="0.65" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="145" y="279" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="12" font-weight="bold" fill="#D1FAE5">ဦးတည်ချက် — အချုပ်အခြာအာဏာ အပြည့်အဝ</text>
  </g>

  <!-- Bottom Sovereign Maxim Banner -->
  <g transform="translate(42, 480)">
    <rect x="0" y="0" width="916" height="50" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.45"/>
    <text x="458" y="31" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="13.5" font-weight="bold" fill="#FDE68A">“ကြိုးတန်းပေါ်မှ ဟန်ချက်ညီစွာ ဖြတ်သန်းနိုင်ရေးသည် ပြည်ပအင်အားကြီးများထက် မြန်မာပြည်သူများ၏ စုပေါင်းဆုံးဖြတ်ချက်အပေါ်သာ မူတည်သည်”</text>
  </g>
</svg>
