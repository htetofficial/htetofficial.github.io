<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">တီထွင်သူများနှင့် သမိုင်းထဲက အမျိုးသမီးများ — #Htet #Women #inventors #STEM</title>
  <desc id="desc">Editorial illustration for a Women Nation journal post examining why famous inventors are not all inventors, featuring blueprint gears, glowing lightbulb filament, and constellation circuits.</desc>
  <defs>
    <linearGradient id="bgStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d4b"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="78%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f5c469"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="barStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Canvas & Blueprint Grid -->
  <rect width="1200" height="675" fill="url(#bgStem)"/>
  <rect width="1200" height="675" fill="url(#bulbGlow)"/>
  <g stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="675"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
    <line x1="1080" y1="0" x2="1080" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Outer Frame -->
  <rect x="26" y="26" width="1148" height="623" rx="18" fill="none" stroke="#f5c469" stroke-opacity="0.32" stroke-width="1.2"/>
  <rect x="34" y="34" width="1132" height="607" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.8"/>

  <!-- Right Emblem: Illuminated Patent Blueprint Lightbulb + Venus STEM Orbit -->
  <g transform="translate(920, 315)">
    <circle cx="0" cy="0" r="196" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="0" cy="0" r="154" fill="none" stroke="#f472b6" stroke-opacity="0.28" stroke-width="1.1" stroke-dasharray="6 7"/>
    <!-- Tilted Orbital Rings (Atom / STEM Innovation) -->
    <ellipse cx="0" cy="-12" rx="148" ry="52" transform="rotate(-28 0 -12)" fill="none" stroke="#fde68a" stroke-opacity="0.38" stroke-width="1.4"/>
    <ellipse cx="0" cy="-12" rx="148" ry="52" transform="rotate(28 0 -12)" fill="none" stroke="#f9a8d4" stroke-opacity="0.38" stroke-width="1.4"/>

    <!-- Lightbulb Glass & Filament fused with Venus Symbol -->
    <path d="M 0 -116 C -58 -116, -92 -72, -92 -20 C -92 16, -64 40, -48 66 L -40 84 L 40 84 L 48 66 C 64 40, 92 16, 92 -20 C 92 -72, 58 -116, 0 -116 Z"
          fill="#fde68a" fill-opacity="0.11" stroke="url(#goldStem)" stroke-width="2.4"/>
    <!-- Bulb Base Threads -->
    <rect x="-34" y="88" width="68" height="11" rx="5" fill="none" stroke="#f5c469" stroke-width="1.8"/>
    <rect x="-26" y="104" width="52" height="10" rx="5" fill="none" stroke="#f5c469" stroke-width="1.8"/>
    <!-- Venus Cross extending below bulb base -->
    <line x1="0" y1="114" x2="0" y2="148" stroke="#f9a8d4" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-18" y1="132" x2="18" y2="132" stroke="#f9a8d4" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Glowing Inner Filament Spark -->
    <circle cx="0" cy="-28" r="24" fill="none" stroke="#fef3c7" stroke-width="2.2"/>
    <path d="M -18 68 L -12 -6 M 18 68 L 12 -6" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 0 -62 L 4 -50 L 16 -46 L 4 -42 L 0 -30 L -4 -42 L -16 -46 L -4 -50 Z" fill="#fef3c7" opacity="0.95"/>

    <!-- Orbital Nodes -->
    <circle cx="-122" cy="-76" r="5" fill="#38bdf8"/>
    <circle cx="128" cy="-64" r="5" fill="#f472b6"/>
    <circle cx="116" cy="68" r="4.5" fill="#fde68a"/>
    <circle cx="-116" cy="58" r="4.5" fill="#c084fc"/>

    <!-- Formula Caption -->
    <text x="0" y="182" text-anchor="middle" fill="#fde68a" font-family="'Inter', monospace" font-size="13" font-weight="700" letter-spacing="1.6">FAMOUS INVENTORS  &#8800;  ALL INVENTORS</text>
    <text x="0" y="206" text-anchor="middle" fill="#fbcfe8" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="13.5">သမိုင်းမှတ်တမ်းခွင့်နှင့် တီထွင်ဖန်တီးမှု အမှန်တရား</text>
  </g>

  <!-- Left Typography Column -->
  <g transform="translate(72, 86)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="388" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#f5c469" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8"/>
    <text x="34" y="22" fill="#fef3c7" font-family="'Inter', sans-serif" font-size="12.2" font-weight="600" letter-spacing="1.5">WOMEN NATION • JOURNAL NOTE</text>

    <!-- Kicker -->
    <text x="2" y="72" fill="#f9a8d4" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">16 SEPTEMBER 2026  •  #HTET  #WOMEN  #INVENTORS  #STEM</text>

    <!-- Main Burmese Title -->
    <text x="0" y="134" fill="#ffffff" font-family="'Pyidaungsu', 'Noto Serif Myanmar', Georgia, serif" font-size="37" font-weight="700">“တီထွင်သူ” လို့ ပြောလိုက်တာနဲ့ ဘာလို့</text>
    <text x="0" y="188" fill="#fde68a" font-family="'Pyidaungsu', 'Noto Serif Myanmar', Georgia, serif" font-size="37" font-weight="700">အမျိုးသားမျက်နှာတွေပဲ မြင်ယောင်နေတာလဲ?</text>

    <!-- Divider -->
    <rect x="2" y="212" width="142" height="3.5" rx="2" fill="url(#barStem)"/>

    <!-- Subtitle -->
    <text x="0" y="252" fill="#e2e8f0" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="18">“သမိုင်းမှာ ထင်ရှားခဲ့တဲ့ တီထွင်သူတွေ” နဲ့ “တကယ့်တီထွင်သူ အားလုံး” မတူညီပါ</text>
    <text x="0" y="284" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="15.5">Why Famous Inventors Do Not Equal All Inventors — Access, Patents &amp; Recorded History</text>

    <!-- Pull Quote Card -->
    <rect x="0" y="318" width="590" height="132" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#f9a8d4" stroke-opacity="0.32" stroke-width="1"/>
    <rect x="0" y="318" width="5" height="132" rx="2.5" fill="url(#barStem)"/>
    <text x="24" y="352" fill="#fef3c7" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.5" font-weight="600">“ကမ္ဘာ့တီထွင်မှုအားလုံးကို အမျိုးသားတွေကချည်း ဖန်တီးခဲ့တာ မဟုတ်ပါဘူး။</text>
    <text x="24" y="380" fill="#fef3c7" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.5" font-weight="600">ပညာသင်ယူခွင့်၊ ငွေကြေး၊ မူပိုင်ခွင့်နဲ့ သမိုင်းမှာ မှတ်တမ်းတင်နိုင်ခွင့် ပိုရခဲ့ကြလို့သာ</text>
    <text x="24" y="408" fill="#fbcfe8" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.5" font-weight="600">‘တီထွင်သူများ’ အဖြစ် လူသိများနေကြခြင်း ဖြစ်ပါတယ်။”</text>
    <text x="24" y="436" fill="#bae6fd" font-family="'Inter', sans-serif" font-size="12.5">— Htet • t.me/womennationwomenkingdom</text>

    <!-- Footer Metadata -->
    <g transform="translate(0, 482)">
      <text x="0" y="16" fill="#f8fafc" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15" font-weight="600">ရေးသားသူ — ထက် (#Htet) • Women Nation Telegram Dispatch</text>
      <text x="0" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12.5">Journal Note (Non-Article)  •  16 September 2026  •  t.me/womennationwomenkingdom</text>
    </g>
  </g>

  <!-- Hanko Seal -->
  <g transform="translate(1078, 558)">
    <rect x="0" y="0" width="66" height="66" rx="12" fill="#b91c1c" fill-opacity="0.92" stroke="#fecaca" stroke-opacity="0.68" stroke-width="1.5"/>
    <rect x="5" y="5" width="56" height="56" rx="8" fill="none" stroke="#fde68a" stroke-opacity="0.52" stroke-width="1"/>
    <text x="33" y="41" text-anchor="middle" fill="#fff7ed" font-family="'Pyidaungsu', 'Noto Serif Myanmar', serif" font-size="24" font-weight="700">ထက်</text>
    <text x="33" y="56" text-anchor="middle" fill="#fecaca" font-family="'Inter', sans-serif" font-size="7.2" letter-spacing="1.4" font-weight="600">HTET SEAL</text>
  </g>
</svg>
