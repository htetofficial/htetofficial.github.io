<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Essential Skills of a Politician: Philosophy to Governance — Htet Note</title>
  <desc id="desc">Editorial artwork illustrating the five core capabilities of a politician: logical thought, openness to criticism, policy translation, institution building, and evidence-based adaptability.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="amberAura" cx="74%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080e1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan-Blue Policy Line -->
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#amberAura)"/>

  <!-- Editorial Double Border -->
  <rect x="28" y="28" width="1144" height="619" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="36" y="36" width="1128" height="603" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.8"/>

  <!-- Right Visual: The Synthesis of Philosophical Theory and Practical Governance -->
  <g transform="translate(680, 85)">
    <!-- Base Glow -->
    <ellipse cx="230" cy="240" rx="200" ry="200" fill="#3b82f6" opacity="0.1" filter="url(#cardGlow)"/>

    <!-- Central Compass & Scales of Governance -->
    <!-- Large Compass Circle -->
    <circle cx="230" cy="240" r="165" fill="#0f172a" fill-opacity="0.85" stroke="url(#goldAccent)" stroke-width="2.5" filter="url(#cardGlow)"/>
    <circle cx="230" cy="240" r="150" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

    <!-- Blueprint Grid Lines behind Compass -->
    <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
      <line x1="80" y1="240" x2="380" y2="240"/>
      <line x1="230" y1="90" x2="230" y2="390"/>
      <line x1="124" y1="134" x2="336" y2="346"/>
      <line x1="124" y1="346" x2="336" y2="134"/>
    </g>

    <!-- Pragmatic Policy Gears (Lower Right) -->
    <g transform="translate(320, 310)" stroke="#f59e0b" stroke-width="2" fill="#1e293b" opacity="0.85">
      <circle cx="0" cy="0" r="38"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a"/>
      <!-- Gear Teeth -->
      <path d="M -6,-42 L 6,-42 L 4,-36 L -4,-36 Z"/>
      <path d="M -6,42 L 6,42 L 4,36 L -4,36 Z"/>
      <path d="M -42,-6 L -42,6 L -36,4 L -36,-4 Z"/>
      <path d="M 42,-6 L 42,6 L 36,4 L 36,-4 Z"/>
    </g>

    <!-- Scales of Deliberation & Logic (Central) -->
    <g transform="translate(230, 180)">
      <!-- Balance Beam -->
      <line x1="0" y1="0" x2="0" y2="85" stroke="#fef08a" stroke-width="3"/>
      <line x1="-75" y1="12" x2="75" y2="12" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="12" r="5" fill="#f59e0b"/>
      <!-- Left Pan (Theory / Philosophy) -->
      <line x1="-75" y1="12" x2="-95" y2="55" stroke="#fef08a" stroke-width="1.2"/>
      <line x1="-75" y1="12" x2="-55" y2="55" stroke="#fef08a" stroke-width="1.2"/>
      <path d="M -105,55 Q -75,70 -45,55 Z" fill="#3b82f6" fill-opacity="0.4" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="-75" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#bfdbfe" text-anchor="middle">THEORY</text>

      <!-- Right Pan (Practice / Policy) -->
      <line x1="75" y1="12" x2="55" y2="55" stroke="#fef08a" stroke-width="1.2"/>
      <line x1="75" y1="12" x2="95" y2="55" stroke="#fef08a" stroke-width="1.2"/>
      <path d="M 45,55 Q 75,70 105,55 Z" fill="#f59e0b" fill-opacity="0.4" stroke="#fde68a" stroke-width="1.5"/>
      <text x="75" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">ACTION</text>
    </g>

    <!-- Evidence & Testing Ribbon -->
    <g transform="translate(230, 395)">
      <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#cardGlow)"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">
        “သက်သေအသစ်အပေါ် မူတည်၍ မိမိအယူအဆကို ပြင်ဆင်နိုင်ခြင်း”
      </text>
    </g>
  </g>

  <!-- Left Editorial Typography & 5 Core Capabilities -->
  <g transform="translate(70, 75)">
    <!-- Header Pill -->
    <rect x="0" y="0" width="240" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1">POLITICAL SCIENCE • LEADERSHIP</text>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      နိုင်ငံရေးသမားတစ်ယောက်အတွက် အရေးကြီးသော စွမ်းရည်များ
    </text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="url(#goldAccent)">
      The 5 Essential Capabilities: From Philosophy to Governance
    </text>

    <!-- 5 Numbered Capabilities List -->
    <g transform="translate(0, 145)">
      <!-- 1 -->
      <g transform="translate(0, 0)">
        <circle cx="14" cy="14" r="12" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">၁</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">အတွေးအခေါ်ကို ယုတ္တိရှိအောင် တည်ဆောက်နိုင်ခြင်း</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Logical and coherent construction of philosophical thought and foundational principles</text>
      </g>

      <!-- 2 -->
      <g transform="translate(0, 52)">
        <circle cx="14" cy="14" r="12" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">၂</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">မတူညီသော အမြင်များကို နားထောင်ပြီး ဝေဖန်ချက်ကို လက်ခံနိုင်ခြင်း</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Active listening to diverse perspectives and welcoming constructive intellectual critique</text>
      </g>

      <!-- 3 -->
      <g transform="translate(0, 104)">
        <circle cx="14" cy="14" r="12" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">၃</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">အယူအဆကို လက်တွေ့ကျသော မူဝါဒအဖြစ် ပြောင်းလဲနိုင်ခြင်း</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Translating abstract theoretical concepts into pragmatic, actionable public policy</text>
      </g>

      <!-- 4 -->
      <g transform="translate(0, 156)">
        <circle cx="14" cy="14" r="12" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd" text-anchor="middle">၄</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">အဖွဲ့အစည်းနှင့် စနစ်များ တည်ဆောက်နိုင်ခြင်း</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Institution building, movement organizing, and sustainable administrative architecture</text>
      </g>

      <!-- 5 -->
      <g transform="translate(0, 208)">
        <circle cx="14" cy="14" r="12" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">၅</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">သက်သေအသစ်အပေါ် မူတည်ပြီး မိမိအယူအဆကို ပြင်ဆင်နိုင်ခြင်း</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Epistemic humility: Willingness to revise convictions when empirical evidence dictates</text>
      </g>
    </g>

    <!-- Key Synthesis Callout -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="530" height="68" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="12.5" font-weight="600" fill="#fef08a">
        ကောင်းသော နိုင်ငံရေးအတွေးအခေါ်ရှင်များသည် ကိုယ့်အယူအဆကို အမြဲပြန်စမ်းသပ်ကြသည်။
      </text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#cbd5e1">
        သီအိုရီကောင်းတိုင်း လက်တွေ့မအောင်မြင်နိုင်သလို၊ စာမရေးသော်လည်း အကောင်အထည်ဖော် ထူးချွန်သူများလည်း ရှိသည်။
      </text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(70, 600)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
      Htet Official Journal • Political Philosophy Note (2026-08-05) • Author: Htet Myat Ekri
    </text>
    <text x="1060" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="600">
      #Htet #PoliticalScience #Leadership
    </text>
  </g>
</svg>
