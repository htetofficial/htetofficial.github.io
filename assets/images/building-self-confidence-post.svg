<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Building Genuine Self-Confidence &amp; Self-Love — Htet Note</title>
  <desc id="desc">Editorial artwork depicting a reflection of self-acceptance, inner growth, and confidence, stepping away from comparison toward self-worth.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2a1228"/>
    </linearGradient>

    <!-- Warm Golden Light of Self-Acceptance -->
    <radialGradient id="sunGlow" cx="72%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#0c1222" stop-opacity="0"/>
    </radialGradient>

    <!-- Mirror Frame Metallic Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Rose-Amber Shimmer -->
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <filter id="bloomSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#sunGlow)"/>

  <!-- Outer Double Border -->
  <rect x="28" y="28" width="1144" height="619" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="36" y="36" width="1128" height="603" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.8"/>

  <!-- Right Visual: The Illuminated Mirror of Self-Discovery & Blooming Inner Light -->
  <g transform="translate(680, 80)">
    <!-- Aura behind mirror -->
    <ellipse cx="230" cy="250" rx="210" ry="240" fill="#f43f5e" opacity="0.12" filter="url(#bloomSoft)"/>

    <!-- Elegant Vintage Standing Mirror Frame -->
    <ellipse cx="230" cy="250" rx="170" ry="215" fill="none" stroke="url(#goldFrame)" stroke-width="8" filter="url(#bloomSoft)"/>
    <ellipse cx="230" cy="250" rx="160" ry="205" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Mirror Inner Reflection Sky & Horizon -->
    <clipPath id="mirrorClip">
      <ellipse cx="230" cy="250" rx="158" ry="203"/>
    </clipPath>

    <g clip-path="url(#mirrorClip)">
      <!-- Dawn Horizon inside Mirror (New Self Dawning) -->
      <rect x="60" y="40" width="340" height="420" fill="#0f172a"/>
      <radialGradient id="dawnGlow" cx="50%" cy="65%" r="65%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
        <stop offset="35%" stop-color="#fb7185" stop-opacity="0.6"/>
        <stop offset="70%" stop-color="#431407" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
      </radialGradient>
      <rect x="60" y="40" width="340" height="420" fill="url(#dawnGlow)"/>

      <!-- Rising Sun of Confidence -->
      <circle cx="230" cy="300" r="54" fill="#fef08a" opacity="0.85" filter="url(#bloomSoft)"/>

      <!-- Blooming Flowers at base of reflection -->
      <g transform="translate(230, 390)">
        <ellipse cx="-45" cy="0" rx="30" ry="14" fill="#fb7185" opacity="0.7"/>
        <ellipse cx="45" cy="0" rx="30" ry="14" fill="#fb7185" opacity="0.7"/>
        <ellipse cx="0" cy="8" rx="40" ry="16" fill="#f43f5e" opacity="0.85"/>
        <circle cx="0" cy="4" r="8" fill="#fef08a"/>
      </g>

      <!-- The Confident Woman's Silhouette Standing Tall in Reflection -->
      <g transform="translate(230, 215)">
        <!-- Head & Updo / Flowing Hair -->
        <circle cx="0" cy="-45" r="18" fill="#020617"/>
        <path d="M -12,-52 C -24,-45 -22,-25 -14,-15 C -2,-12 12,-15 15,-30 C 18,-45 8,-54 -12,-52 Z" fill="#020617"/>
        <path d="M 12,-40 C 26,-20 22,25 14,55" stroke="#fef08a" stroke-width="1.8" fill="none" opacity="0.8"/>
        <!-- Shoulders held back with dignity and poise -->
        <path d="M -26,-15 C -15,-25 15,-25 26,-15 L 34,70 L -34,70 Z" fill="#020617"/>
        <!-- Glowing Crown of Self-Worth -->
        <path d="M -15,-66 L -8,-74 L 0,-67 L 8,-74 L 15,-66 L 10,-60 L -10,-60 Z" fill="#fef08a" filter="url(#bloomSoft)"/>
      </g>
    </g>

    <!-- Mirror Stand Base -->
    <path d="M 160,460 L 230,485 L 300,460" stroke="url(#goldFrame)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="230" cy="495" rx="55" ry="10" fill="url(#goldFrame)"/>

    <!-- Floating Sparkles of Confidence -->
    <g fill="#fef08a" opacity="0.9" filter="url(#bloomSoft)">
      <polygon points="90,140 93,148 101,151 93,154 90,162 87,154 79,151 87,148"/>
      <polygon points="380,180 382,186 388,188 382,190 380,196 378,190 372,188 378,186"/>
      <polygon points="120,380 122,385 127,387 122,389 120,394 118,389 113,387 118,385"/>
    </g>
  </g>

  <!-- Left Editorial Typography & Practical Growth Steps -->
  <g transform="translate(70, 75)">
    <!-- Header Pill -->
    <rect x="0" y="0" width="230" height="28" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde68a" letter-spacing="1">SELF-LOVE • CONFIDENCE • GROWTH</text>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      မှန်ထဲက ကိုယ့်ကိုယ်ကိုယ် သဘောမကျရာကနေ
    </text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="url(#roseGlow)">
      Building Genuine Self-Confidence &amp; Practicing Self-Love
    </text>

    <!-- Core Takeaway Card -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="530" height="120" rx="10" fill="#1e1b4b" fill-opacity="0.75" stroke="#4338ca" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#fb7185" stroke-width="4"/>

      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#fde047">“</text>
      <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="13.5" font-weight="600" fill="#fecdd3">
        ကိုယ့်ကိုယ်ကိုယ် ယုံကြည်မှုဆိုတာ မွေးရာပါလာတာ မဟုတ်ဘူး၊
      </text>
      <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="13.5" font-weight="600" fill="#fecdd3">
        ကိုယ့်ဘာသာ ဖြည်းဖြည်းချင်း တည်ဆောက်ယူရတာမျိုးပါ။
      </text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="12" fill="#cbd5e1">
        သူများတွေ ကိုယ့်ကို ဘယ်လိုမြင်လဲထက်၊ ကိုယ်က ကိုယ့်ကိုယ်ကိုယ် ဘယ်လိုတန်ဖိုးထားလဲဆိုတာက အရေးကြီးဆုံး။
      </text>
      <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11" fill="#94a3b8">
        Once you embrace your vulnerabilities, no one can use them against you.
      </text>
    </g>

    <!-- 4 Action Pillars for Real Confidence -->
    <g transform="translate(0, 280)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="14" cy="14" r="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">၁</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">သူများနှင့် လိုက်မယှဉ်ပါနှင့် (Stop Social Comparison)</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">Social Media ပေါ်က အရာတိုင်းသည် အစစ်အမှန်မဟုတ်ဘဲ ရွေးချယ်ပြသထားချက်များသာဖြစ်သည်</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 52)">
        <circle cx="14" cy="14" r="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">၂</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">အားနည်းချက်ကို ရဲရဲလက်ခံပါ (Embrace Vulnerabilities)</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">ကိုယ့်အားနည်းချက်ကို ကိုယ်တိုင်လက်ခံထားနိုင်ပါက မည်သူကမျှ ၎င်းဖြင့် ထိုးနှက်၍မရတော့ပါ</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 104)">
        <circle cx="14" cy="14" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd" text-anchor="middle">၃</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">အဝတ်အစားနှင့် စာဖတ်ခြင်း (Style &amp; Intellectual Substance)</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">သပ်ရပ်သောအဝတ်အစားနှင့် စာဖတ်လေ့လာထားသောအသိပညာက လူကြားထဲတွင် ရဲဝံ့စေသည်</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 156)">
        <circle cx="14" cy="14" r="12" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.4"/>
        <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">၄</text>
        <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="14" font-weight="600" fill="#ffffff">ကိုယ့်ကိုယ်ကိုယ် အရင်ဆုံး ချစ်ပါ (Self-Love as Priority)</text>
        <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', sans-serif" font-size="11.5" fill="#94a3b8">အခြားသူများ အသိအမှတ်ပြုမှုထက် ကိုယ်တိုင်ပေးသော တန်ဖိုးကသာ အခိုင်မာဆုံးအခြေခံဖြစ်သည်</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(70, 600)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
      Htet Official Journal • IdeaHub Myanmar (2026-08-10) • Author: Htet Myat Ekri
    </text>
    <text x="1060" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pyidaungsu', 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="600">
      t.me/ideahubmyanmarv2
    </text>
  </g>
</svg>
