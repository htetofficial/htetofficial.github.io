<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="50%" stop-color="#221C18"/>
      <stop offset="100%" stop-color="#100E0C"/>
    </linearGradient>
    <linearGradient id="vermilionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle borders -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#3D352E" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <rect x="45" y="45" width="1110" height="540" rx="16" fill="none" stroke="#DC2626" stroke-width="1" opacity="0.25"/>

  <!-- Top Badges -->
  <rect x="80" y="75" width="280" height="38" rx="19" fill="url(#vermilionGrad)"/>
  <text x="220" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">HONEST INFORMATION</text>

  <rect x="375" y="75" width="300" height="38" rx="19" fill="#2A2420" stroke="#4A3F35" stroke-width="1"/>
  <text x="525" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F87171" text-anchor="middle" letter-spacing="1">POLITICAL &amp; FEMINIST CRITIQUE</text>

  <rect x="690" y="75" width="200" height="38" rx="19" fill="#221E1A" stroke="#3D352E" stroke-width="1"/>
  <text x="790" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#D1D5DB" text-anchor="middle">OCTOBER 27, 2025</text>

  <!-- Title (Burmese) -->
  <text x="80" y="185" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    စစ်အုပ်စု၏ ဟန်ပြရွေးကောက်ပွဲအပေါ် အမျိုးသမီးအမြင်
  </text>
  <text x="80" y="235" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="24" font-weight="600" fill="#FCA5A5">
    ဖီမင်နစ်နှင့် နိုင်ငံရေးသိပ္ပံ ရှုထောင့်မှ အာဏာရှင်ပြဇာတ်အား ဝေဖန်ဆန်းစစ်ချက်
  </text>

  <!-- English Subtitle -->
  <text x="80" y="285" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-style="italic" fill="#E5E7EB">
    Authoritarian Spectacle: Feminist &amp; Political Science Critique of the Junta's Sham Election
  </text>

  <!-- Quote Box / Key Excerpt -->
  <rect x="80" y="325" width="1040" height="155" rx="16" fill="#1C1815" stroke="#DC2626" stroke-width="1.5" opacity="0.95"/>
  <rect x="80" y="325" width="8" height="155" rx="4" fill="#DC2626"/>
  
  <text x="110" y="365" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="17" fill="#F3F4F6" font-weight="500">
    "ဒါဟာ တကယ့်ပြည်သူ့ဆန္ဒကို ကိုယ်စားပြုတဲ့ ရွေးကောက်ပွဲမဟုတ်ဘဲ သူတို့ရဲ့ စစ်အာဏာကို နိုင်ငံတကာအသိုင်းအဝိုင်းနဲ့
  </text>
  <text x="110" y="395" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="17" fill="#F3F4F6" font-weight="500">
    ပြည်တွင်းမှာ လှည့်ဖြားပြီး တရားဝင်ဖြစ်ကြောင်း ဟန်ပြဖို့ ကြိုးစားတဲ့ <tspan fill="#FCA5A5" font-weight="bold">အာဏာရှင်တို့၏ ပြဇာတ် (Authoritarian Spectacle)</tspan> တစ်ခုသာ ဖြစ်ပါတယ်။"
  </text>
  <text x="110" y="435" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="15" fill="#9CA3AF">
    — ကုလသမဂ္ဂ လုံခြုံရေးကောင်စီ ဆုံးဖြတ်ချက် ၁၃၂၅ (UNSCR 1325) နှင့် အမျိုးသမီး ငြိမ်းချမ်းရေး/လုံခြုံရေး မူဘောင်ဆိုင်ရာ ရပ်တည်ချက်
  </text>

  <!-- Bottom Metadata Row -->
  <g transform="translate(80, 520)">
    <!-- Author Pill -->
    <rect x="0" y="0" width="340" height="50" rx="25" fill="#2A2420" stroke="#4A3F35" stroke-width="1"/>
    <circle cx="25" cy="25" r="16" fill="#DC2626"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="52" y="24" font-family="'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">ထက်မြတ်ဧကရီ</text>
    <text x="52" y="41" font-family="sans-serif" font-size="11" fill="#9CA3AF">Political and Social Writer, Yangon</text>

    <!-- Source URL badge -->
    <rect x="355" y="0" width="310" height="50" rx="25" fill="#221E1A" stroke="#3D352E" stroke-width="1"/>
    <text x="375" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F87171">PUBLISHED ON HI BURMA</text>
    <text x="375" y="41" font-family="sans-serif" font-size="11" fill="#9CA3AF">hiburma.net/2025/10/စစ်အုပ်စုရဲ့-ရွေးကောက်ပွဲပ/</text>

    <!-- Hanko Stamp / Seal -->
    <g transform="translate(960, -5)">
      <rect x="0" y="0" width="80" height="60" rx="10" fill="none" stroke="#DC2626" stroke-width="2.5" opacity="0.9"/>
      <rect x="4" y="4" width="72" height="52" rx="7" fill="none" stroke="#DC2626" stroke-width="1" opacity="0.6"/>
      <text x="40" y="26" font-family="'Pyidaungsu', sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">နိုင်ငံရေး</text>
      <text x="40" y="46" font-family="'Pyidaungsu', sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">သဘောထား</text>
    </g>
  </g>
</svg>