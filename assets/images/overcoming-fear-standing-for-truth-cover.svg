<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ကြောက်ရွံ့ခြင်းကို ကျော်လွှား၍ အမှန်တရားအတွက် ရပ်တည်ခြင်း — Overcoming Fear and Standing for Truth">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="48%" stop-color="#1E1B3A"/>
      <stop offset="100%" stop-color="#3B1D2E"/>
    </linearGradient>
    <radialGradient id="truthDawn" cx="76%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#F59E0B" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#BE123C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wallDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Twilight Background -->
  <rect width="1200" height="675" fill="url(#bgSky)"/>
  <rect width="1200" height="675" fill="url(#truthDawn)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#F8FAFC" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Right Side Editorial Visual: Breaking the Wall of Fear with Light of Truth -->
  <g transform="translate(700, 60)">
    <!-- Light rays bursting through fracture -->
    <polygon points="210,250 -140,80 -140,185" fill="url(#beamGrad)"/>
    <polygon points="210,250 -160,245 -160,350" fill="url(#beamGrad)"/>
    <polygon points="210,250 -110,415 -110,500" fill="url(#beamGrad)"/>

    <!-- Concentric Halo Rings of Truth -->
    <circle cx="215" cy="255" r="195" fill="none" stroke="#FDE68A" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle cx="215" cy="255" r="145" fill="none" stroke="#F59E0B" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="215" cy="255" r="95" fill="#FDE68A" fill-opacity="0.14"/>
    <circle cx="215" cy="255" r="52" fill="#FEF3C7" fill-opacity="0.88" filter="url(#softGlow)"/>

    <!-- Fractured Wall of Fear blocks parting away from light -->
    <g fill="url(#wallDark)" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.2">
      <!-- Left fractured monolith -->
      <polygon points="35,95 148,118 130,225 156,280 122,380 144,475 35,475"/>
      <!-- Cracked floating shards -->
      <polygon points="154,142 184,158 168,195 146,184" fill="#1E293B" stroke="#FDE68A" stroke-opacity="0.6"/>
      <polygon points="150,315 178,302 188,334 156,348" fill="#1E293B" stroke="#FDE68A" stroke-opacity="0.6"/>
      <!-- Right fractured monolith -->
      <polygon points="288,108 408,95 408,475 292,475 312,374 282,295 310,210"/>
      <polygon points="258,175 282,162 292,196 266,204" fill="#1E293B" stroke="#FDE68A" stroke-opacity="0.55"/>
      <polygon points="256,348 286,336 296,368 264,376" fill="#1E293B" stroke="#FDE68A" stroke-opacity="0.55"/>
    </g>

    <!-- Five Stepping Stones of Courage ascending into the light -->
    <g fill="#FDE68A" fill-opacity="0.85">
      <rect x="172" y="458" width="86" height="6" rx="3" fill-opacity="0.40"/>
      <rect x="180" y="432" width="70" height="6" rx="3" fill-opacity="0.55"/>
      <rect x="188" y="406" width="54" height="6" rx="3" fill-opacity="0.72"/>
      <rect x="195" y="380" width="40" height="6" rx="3" fill-opacity="0.86"/>
      <rect x="202" y="354" width="26" height="6" rx="3" fill-opacity="1"/>
    </g>

    <!-- Stylized Compass / Beacon Star inside the sun -->
    <path d="M215,212 L222,248 L258,255 L222,262 L215,298 L208,262 L172,255 L208,248 Z" fill="#9A3412" fill-opacity="0.85"/>
    <circle cx="215" cy="255" r="7" fill="#FEF3C7"/>

    <!-- Minimal Caption Badge below visual -->
    <text x="215" y="518" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3.5" fill="#FDE68A" fill-opacity="0.82">FIVE BRAVE STEPS AMID FEAR</text>
    <text x="215" y="542" text-anchor="middle" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="13" fill="#CBD5E1" fill-opacity="0.78">အသိပညာ • အသံ • စည်းလုံးမှု • စွမ်းရည် • ဂရုစိုက်မှု</text>
  </g>

  <!-- Outer Editorial Border -->
  <rect x="28" y="28" width="1144" height="619" rx="6" fill="none" stroke="#FDE68A" stroke-opacity="0.24" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="603" rx="4" fill="none" stroke="#F8FAFC" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Left Editorial Typography Column -->
  <g transform="translate(76, 86)">
    <!-- Kicker Badge -->
    <rect x="0" y="0" width="286" height="32" rx="16" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.65" stroke-width="1"/>
    <text x="143" y="21" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2.2" fill="#FDE68A">POLITICAL ESSAY &amp; SPEECH</text>

    <!-- Date & Source Tag -->
    <text x="304" y="21" font-family="Georgia, serif" font-size="13" letter-spacing="1.5" fill="#CBD5E1" fill-opacity="0.85">JULY 27, 2025</text>

    <!-- Main Burmese Title -->
    <text x="0" y="102" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="38" font-weight="bold" fill="#FFFBEB">ကြောက်ရွံ့ခြင်းကို ကျော်လွှား၍</text>
    <text x="0" y="160" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="38" font-weight="bold" fill="#FDE68A">အမှန်တရားအတွက် ရပ်တည်ခြင်း</text>

    <!-- Gold Divider -->
    <rect x="0" y="190" width="490" height="2.5" fill="url(#goldRule)"/>

    <!-- English Subtitle -->
    <text x="0" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#F1F5F9">Overcoming Fear and Standing for Truth</text>
    <text x="0" y="262" font-family="Georgia, serif" font-size="14" letter-spacing="0.6" fill="#CBD5E1" fill-opacity="0.9">Systemic Fear, Personal &amp; Collective Truth, and Youth Civic Courage</text>

    <!-- Pull Quote Box -->
    <g transform="translate(0, 296)">
      <rect x="0" y="0" width="560" height="122" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="122" rx="2" fill="#F59E0B"/>
      <text x="24" y="34" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="15.5" fill="#FEF3C7">“ကြောက်ရွံ့ခြင်းဆိုတဲ့ နံရံကြီးကို ကျွန်မတို့ရဲ့ ရဲရင့်ခြင်းဆိုတဲ့</text>
      <text x="24" y="62" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="15.5" fill="#FEF3C7">ခြေတစ်လှမ်းချင်းနဲ့ ဖြိုချကြရအောင်။ တိတ်ဆိတ်ခြင်းဆိုတဲ့</text>
      <text x="24" y="90" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="15.5" fill="#FDE68A">အမှောင်ထုကြီးကို အမှန်တရားဆိုတဲ့ အသံတွေနဲ့ ခွင်းကြရအောင်။”</text>
    </g>

    <!-- Author & Hanko Stamp Footer -->
    <g transform="translate(0, 456)">
      <!-- Hanko Stamp -->
      <rect x="0" y="0" width="48" height="48" rx="6" fill="#991B1B" stroke="#FCA5A5" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="24" y="31" text-anchor="middle" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="19" font-weight="bold" fill="#FEF2F2">ထက်</text>

      <text x="64" y="20" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="16" font-weight="bold" fill="#FFFBEB">ထက် (Htet) — နိုင်ငံရေးသိပ္ပံလေ့လာသူနှင့် စာရေးသူ</text>
      <text x="64" y="42" font-family="Georgia, serif" font-size="12.5" letter-spacing="0.8" fill="#CBD5E1" fill-opacity="0.82">HTET OFFICIAL DIGITAL ARCHIVE • ORIGINALLY PUBLISHED ON BLOGSPOT</text>
    </g>
  </g>
</svg>
