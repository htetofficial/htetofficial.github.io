<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="50%" stop-color="#1F2430"/>
      <stop offset="100%" stop-color="#0E121A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tuRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Borders -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <rect x="45" y="45" width="1110" height="540" rx="16" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.25"/>

  <!-- Top Badges -->
  <rect x="80" y="75" width="310" height="38" rx="19" fill="url(#goldGrad)"/>
  <text x="235" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#141820" text-anchor="middle" letter-spacing="1.5">HISTORICAL LANDMARK ARCHIVE</text>

  <rect x="405" y="75" width="230" height="38" rx="19" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="520" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#FBBF24" text-anchor="middle" letter-spacing="1">THAMMASAT 1934 (B.E. 2477)</text>

  <!-- Main Thai Title -->
  <text x="80" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F8FAFC" letter-spacing="0.5">
    คำประศาสน์การ มหาวิทยาลัยวิชาธรรมศาสตร์และการเมือง
  </text>
  
  <!-- Subtitle Myanmar / English -->
  <text x="80" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#FBBF24">
    ဓမ္မသတ်နှင့် နိုင်ငံရေးတက္ကသိုလ် ဖွင့်ပွဲ သမိုင်းဝင်မိန့်ခွန်း — ပရီဒီ ဖနုမ်ယောင် (Pridi Banomyong)
  </text>

  <!-- Golden Quote Box -->
  <rect x="80" y="270" width="1040" height="190" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" opacity="0.85"/>
  
  <text x="120" y="325" font-family="'Georgia', serif" font-size="20" font-style="italic" fill="#E2E8F0">
    "มหาวิทยาลัยย่อมอุปมาประดุจบ่อน้ำ บำบัดความกระหายของราษฎรผู้สมัครแสวงหาความรู้"
  </text>
  <text x="120" y="365" font-family="'Georgia', serif" font-size="18" font-style="italic" fill="#CBD5E1">
    "อันเป็นสิทธิและโอกาสที่เขาควรมีควรได้ ตามหลักแห่งเสรีภาพในการศึกษา"
  </text>
  <text x="120" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
    "A university is like a public well that quenches the thirst of the people seeking knowledge."
  </text>

  <!-- Footer Information -->
  <text x="80" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" fill="#F8FAFC">
    ปรีดี พนมยงค์ (Pridi Banomyong) • 27 มิถุนายน 2477 (27 June 1934)
  </text>
  <text x="80" y="555" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748B">
    Htet Official Research Platform Historical Archives • Democratic Pedagogy Series
  </text>
</svg>
