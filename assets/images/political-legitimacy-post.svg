<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">တရားဝင်မှု (Legitimacy) ဆိုတာ ဘာလဲ? — Political Science &amp; Sociology Note</title>
  <desc id="desc">Editorial illustration depicting political legitimacy as the foundation of public trust supporting governance, contrasting lawful consent with raw coercion.</desc>
  <defs>
    <linearGradient id="bgLegit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="amberHalo" cx="78%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#ef4444" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#f5c469"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentLegit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="675" fill="url(#bgLegit)"/>
  <rect width="1200" height="675" fill="url(#amberHalo)"/>

  <!-- Outer Editorial Double Frame -->
  <rect x="26" y="26" width="1148" height="623" rx="18" fill="none" stroke="#f5c469" stroke-opacity="0.32" stroke-width="1.2"/>
  <rect x="34" y="34" width="1132" height="607" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.8"/>

  <!-- Right Emblem: Classical Civic Temple Resting ONLY on Public Trust Foundation -->
  <g transform="translate(920, 322)">
    <circle cx="0" cy="-12" r="196" fill="none" stroke="#fde68a" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="0" cy="-12" r="154" fill="none" stroke="#f87171" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="6 7"/>

    <!-- Civic Pediment Roof (Governance / State) -->
    <polygon points="0,-138 -118,-72 118,-72" fill="#fde68a" fill-opacity="0.13" stroke="url(#goldPillar)" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-124" y="-72" width="248" height="14" rx="3" fill="#f5c469" fill-opacity="0.22" stroke="url(#goldPillar)" stroke-width="1.6"/>

    <!-- 3 Civic Columns: Moral Right • Legal Consent • Public Trust -->
    <g fill="#ffffff" fill-opacity="0.08" stroke="url(#goldPillar)" stroke-width="1.8">
      <rect x="-94" y="-58" width="28" height="106" rx="3"/>
      <rect x="-14" y="-58" width="28" height="106" rx="3"/>
      <rect x="66" y="-58" width="28" height="106" rx="3"/>
    </g>

    <!-- Glowing Foundation Bar: PUBLIC CONSENT & TRUST (Without it, the State Collapses into Banditry) -->
    <rect x="-132" y="54" width="264" height="36" rx="9" fill="#b91c1c" fill-opacity="0.34" stroke="url(#accentLegit)" stroke-width="2"/>
    <text x="0" y="77" text-anchor="middle" fill="#fef3c7" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">PUBLIC CONSENT &amp; TRUST</text>

    <!-- Upward Luminous Trust Rays from the People Below -->
    <g stroke="#fde68a" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
      <line x1="-80" y1="116" x2="-80" y2="96"/>
      <line x1="0" y1="122" x2="0" y2="96"/>
      <line x1="80" y1="116" x2="80" y2="96"/>
    </g>
    <g fill="#fde68a" opacity="0.88">
      <circle cx="-80" cy="126" r="5"/>
      <circle cx="-40" cy="132" r="4"/>
      <circle cx="0" cy="130" r="5.5"/>
      <circle cx="40" cy="132" r="4"/>
      <circle cx="80" cy="126" r="5"/>
    </g>

    <!-- Caption -->
    <text x="0" y="166" text-anchor="middle" fill="#fde68a" font-family="Georgia, serif" font-size="13" letter-spacing="2.2" font-weight="600">CONSENT  VS.  COERCION</text>
    <text x="0" y="190" text-anchor="middle" fill="#fecaca" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="13.5">ပြည်သူ့ယုံကြည်လက်ခံမှုသာ အစိုးရ၏ တရားဝင်မှု</text>
  </g>

  <!-- Left Typography Column -->
  <g transform="translate(72, 86)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="406" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#f5c469" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#f59e0b"/>
    <text x="34" y="22" fill="#fef3c7" font-family="'Inter', sans-serif" font-size="12.2" font-weight="600" letter-spacing="1.5">POLITICAL SCIENCE • SOCIOLOGY NOTE</text>

    <!-- Kicker -->
    <text x="2" y="72" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.8">1 SEPTEMBER 2026  •  #SOCIOLOGY  #POLITICALSCIENCE  #LEGITIMACY</text>

    <!-- Main Burmese Headline -->
    <text x="0" y="138" fill="#ffffff" font-family="'Pyidaungsu', 'Noto Serif Myanmar', Georgia, serif" font-size="40" font-weight="700">တရားဝင်မှု (Legitimacy)</text>
    <text x="0" y="194" fill="#fde68a" font-family="'Pyidaungsu', 'Noto Serif Myanmar', Georgia, serif" font-size="40" font-weight="700">ဆိုတာ ဘာလဲ?</text>

    <!-- Accent Rule -->
    <rect x="2" y="218" width="142" height="3.5" rx="2" fill="url(#accentLegit)"/>

    <!-- Subtitle -->
    <text x="0" y="258" fill="#e2e8f0" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="18.5">ဥပဒေစာအုပ်ထဲက စာသားမဟုတ် — ပြည်သူလူထု၏ စိတ်ပိုင်းဆိုင်ရာ ယုံကြည်လက်ခံမှု</text>
    <text x="0" y="290" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="16">Without Public Consent, State Force Collapses into Armed Banditry</text>

    <!-- Pull Quote Glass Card -->
    <rect x="0" y="324" width="588" height="128" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#f5c469" stroke-opacity="0.34" stroke-width="1"/>
    <rect x="0" y="324" width="5" height="128" rx="2.5" fill="url(#accentLegit)"/>
    <text x="24" y="358" fill="#fef3c7" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.6" font-weight="600">“တရားဝင်မှု မရှိတော့ရင် အခွန်ကောက်တာ၊ ဥပဒေထုတ်တာ၊ ဖမ်းဆီးတာ</text>
    <text x="24" y="386" fill="#fef3c7" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.6" font-weight="600">အားလုံးဟာ ဓားပြတစ်ယောက်ရဲ့ လုပ်ရပ်နဲ့ ဘာမှ မကွာခြားတော့ဘဲ</text>
    <text x="24" y="414" fill="#fca5a5" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15.6" font-weight="600">ရိုးရိုးလက်နက်ကိုင် ဓားပြဂိုဏ်းကြီးတစ်ခု အဆင့်ကို ချက်ချင်း လျှောကျသွားပါတယ်။”</text>
    <text x="24" y="440" fill="#cbd5e1" font-family="'Inter', 'Pyidaungsu', sans-serif" font-size="12.5">— ထက်မြတ်ဧကရီ (ထက်) • စက်တင်ဘာ ၁၊ ၂၀၂၆</text>

    <!-- Footer Metadata -->
    <g transform="translate(0, 484)">
      <text x="0" y="16" fill="#f8fafc" font-family="'Pyidaungsu', 'Noto Sans Myanmar', sans-serif" font-size="15" font-weight="600">ရေးသားသူ — ထက်မြတ်ဧကရီ (ထက်) • နိုင်ငံရေးသိပ္ပံနှင့် လူမှုဗေဒ မှတ်စု</text>
      <text x="0" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12.5">Htet Official Journal &amp; Conceptual Glossary  •  1 September 2026</text>
    </g>
  </g>

  <!-- Vermilion Hanko Seal -->
  <g transform="translate(1078, 558)">
    <rect x="0" y="0" width="66" height="66" rx="12" fill="#b91c1c" fill-opacity="0.92" stroke="#fecaca" stroke-opacity="0.68" stroke-width="1.5"/>
    <rect x="5" y="5" width="56" height="56" rx="8" fill="none" stroke="#fde68a" stroke-opacity="0.52" stroke-width="1"/>
    <text x="33" y="41" text-anchor="middle" fill="#fff7ed" font-family="'Pyidaungsu', 'Noto Serif Myanmar', serif" font-size="24" font-weight="700">ထက်</text>
    <text x="33" y="56" text-anchor="middle" fill="#fecaca" font-family="'Inter', sans-serif" font-size="7.2" letter-spacing="1.4" font-weight="600">HTET SEAL</text>
  </g>
</svg>
