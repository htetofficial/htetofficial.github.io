<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ကြိုးတန်းပေါ်က မြန်မာနိုင်ငံ — Myanmar on the Tightrope: US-China Strategic Competition and Myanmar's Sovereign Self-Determination">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1F"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1019"/>
    </linearGradient>
    <radialGradient id="usGlow" cx="16%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cnGlow" cx="86%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mmGlow" cx="50%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="35%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base Geopolitical Canvas -->
  <rect width="1200" height="675" fill="url(#trBg)"/>
  <rect width="1200" height="675" fill="url(#usGlow)"/>
  <rect width="1200" height="675" fill="url(#cnGlow)"/>
  <rect width="1200" height="675" fill="url(#mmGlow)"/>

  <!-- Subtle Cartographic Meridian Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1" fill="none">
    <ellipse cx="600" cy="360" rx="510" ry="230"/>
    <ellipse cx="600" cy="360" rx="370" ry="230"/>
    <ellipse cx="600" cy="360" rx="220" ry="230"/>
    <ellipse cx="600" cy="360" rx="95" ry="230"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="600" y1="120" x2="600" y2="590"/>
  </g>

  <!-- Outer Monograph Double Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="8" fill="none" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.4"/>
  <rect x="33" y="33" width="1134" height="609" rx="5" fill="none" stroke="#E2E8F0" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Top Classification Strip -->
  <g transform="translate(58, 56)">
    <rect x="0" y="0" width="328" height="30" rx="15" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-opacity="0.65" stroke-width="1"/>
    <text x="164" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" font-weight="bold" letter-spacing="2.2" fill="#FDE68A">GEOPOLITICAL POLICY MONOGRAPH</text>
    <text x="1084" y="20" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.6" fill="#94A3B8">DOSSIER NO. 01 • 2026 EDITION</text>
  </g>

  <!-- Title Header Block -->
  <g transform="translate(58, 128)">
    <text x="542" y="0" text-anchor="middle" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="42" font-weight="bold" fill="#FFFBEB">ကြိုးတန်းပေါ်က မြန်မာနိုင်ငံ</text>
    <text x="542" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#FDE68A">Myanmar on the Tightrope</text>
    <text x="542" y="72" text-anchor="middle" font-family="Pyidaungsu, 'Noto Sans Myanmar', sans-serif" font-size="15.5" fill="#CBD5E1">အမေရိကန်–တရုတ် မဟာဗျူဟာပြိုင်ဆိုင်မှု၊ ပြောင်းလဲနေသော ကမ္ဘာ့အင်အားချိန်ခွင်လျှာနှင့် မြန်မာ့အချုပ်အခြာအာဏာ</text>
    <rect x="312" y="88" width="460" height="2" fill="url(#goldBar)"/>
  </g>

  <!-- Central Geopolitical Tightrope Visual Stage -->
  <g transform="translate(60, 255)">
    <!-- West Pillar: United States / Indo-Pacific -->
    <g transform="translate(30, 26)">
      <rect x="0" y="0" width="215" height="225" rx="14" fill="#0B1733" fill-opacity="0.88" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="0" y="0" width="215" height="6" rx="3" fill="#3B82F6"/>
      <circle cx="107" cy="64" r="32" fill="#1D4ED8" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
      <!-- Stylized Star Shield -->
      <path d="M107,42 L113,57 L129,57 L116,66 L121,82 L107,72 L93,82 L98,66 L85,57 L101,57 Z" fill="#93C5FD"/>
      <text x="107" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.4" fill="#DBEAFE">UNITED STATES</text>
      <text x="107" y="144" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="13" fill="#93C5FD">အမေရိကန် မဟာဗျူဟာ</text>
      <line x1="28" y1="158" x2="187" y2="158" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="107" y="180" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="11.5" fill="#CBD5E1">• America First &amp; Sanctions</text>
      <text x="107" y="201" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="11.5" fill="#CBD5E1">• Indo-Pacific &amp; Taiwan Deterrence</text>
    </g>

    <!-- East Pillar: China / CMEC & 15th FYP -->
    <g transform="translate(835, 26)">
      <rect x="0" y="0" width="215" height="225" rx="14" fill="#230E16" fill-opacity="0.88" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="0" y="0" width="215" height="6" rx="3" fill="#DC2626"/>
      <circle cx="107" cy="64" r="32" fill="#DC2626" fill-opacity="0.25" stroke="#F87171" stroke-width="1.5"/>
      <!-- Stylized Compass Hexagon -->
      <polygon points="107,40 128,52 128,76 107,88 86,76 86,52" fill="none" stroke="#FCA5A5" stroke-width="2.2"/>
      <circle cx="107" cy="64" r="9" fill="#FCA5A5"/>
      <text x="107" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.4" fill="#FEE2E2">CHINA (PRC)</text>
      <text x="107" y="144" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="13" fill="#FCA5A5">တရုတ် မဟာဗျူဟာ</text>
      <line x1="28" y1="158" x2="187" y2="158" stroke="#EF4444" stroke-opacity="0.3"/>
      <text x="107" y="180" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="11.5" fill="#CBD5E1">• CMEC &amp; Indian Ocean Access</text>
      <text x="107" y="201" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="11.5" fill="#CBD5E1">• 15th Five-Year Plan &amp; Border</text>
    </g>

    <!-- The Geopolitical Tightrope Cable -->
    <path d="M 245,148 Q 540,172 835,148" fill="none" stroke="url(#ropeGrad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 245,148 Q 540,172 835,148" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-dasharray="6 6" stroke-opacity="0.7"/>

    <!-- Tension Anchor Nodes -->
    <circle cx="245" cy="148" r="7" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="835" cy="148" r="7" fill="#F87171" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Center Sovereign Balance Emblem: MYANMAR -->
    <g transform="translate(540, 152)">
      <circle cx="0" cy="0" r="88" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 5"/>
      <circle cx="0" cy="0" r="66" fill="#0F172A" fill-opacity="0.92" stroke="#F59E0B" stroke-width="2.2"/>
      <!-- Balancing Scale / Horizon Beam -->
      <line x1="-112" y1="-10" x2="112" y2="-10" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="-112" cy="-10" r="5" fill="#60A5FA"/>
      <circle cx="112" cy="-10" r="5" fill="#F87171"/>
      <!-- Sovereign Star -->
      <path d="M0,-44 L7,-22 L29,-22 L11,-9 L18,12 L0,-1 L-18,12 L-11,-9 L-29,-22 L-7,-22 Z" fill="#F59E0B" filter="url(#glow)"/>
      <text x="0" y="34" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="14" font-weight="bold" fill="#FFFBEB">မြန်မာနိုင်ငံ</text>
      <text x="0" y="51" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" letter-spacing="1.6" fill="#FDE68A">SOVEREIGNTY</text>
    </g>

    <!-- Bottom Caption Pill under Tightrope -->
    <rect x="330" y="256" width="420" height="32" rx="16" fill="#0F172A" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.45"/>
    <text x="540" y="277" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="12.5" fill="#FEF3C7">ကိုယ်ပိုင်အချုပ်အခြာအာဏာ ဆုံးဖြတ်ပိုင်ခွင့်နှင့် တက်ကြွသော ဘက်မလိုက်ရေး</text>
  </g>

  <!-- Footer Author & Seal Bar -->
  <g transform="translate(58, 576)">
    <line x1="0" y1="0" x2="1084" y2="0" stroke="#F59E0B" stroke-opacity="0.25"/>
    <rect x="0" y="14" width="42" height="42" rx="6" fill="#991B1B" stroke="#FCA5A5" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="21" y="42" text-anchor="middle" font-family="Pyidaungsu, sans-serif" font-size="17" font-weight="bold" fill="#FEF2F2">ထက်</text>
    <text x="56" y="32" font-family="Pyidaungsu, sans-serif" font-size="15" font-weight="bold" fill="#FFFBEB">ထက်မြတ်ဧကရီ (Htet Myat Ekri)</text>
    <text x="56" y="52" font-family="Georgia, serif" font-size="12" fill="#94A3B8">Htet Official Research Platform • Geopolitics &amp; Strategic Studies Archive</text>
    <text x="1084" y="42" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#FDE68A">US–CHINA • CMEC • NATO • TAIWAN • 3 SCENARIOS</text>
  </g>
</svg>
