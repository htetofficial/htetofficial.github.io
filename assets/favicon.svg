<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Liquid Ruby Cinnabar Glass Gradient -->
    <radialGradient id="glassBodyGrad" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#F25646"/>
      <stop offset="28%" stop-color="#D73B2C"/>
      <stop offset="65%" stop-color="#AA2216"/>
      <stop offset="100%" stop-color="#70120B"/>
    </radialGradient>

    <!-- Refractive Glass Perimeter Bevel -->
    <linearGradient id="glassPrismBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#4A0A05" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#260402" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Specular Curved Gloss Arc Gradient -->
    <linearGradient id="specularGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass Inner Caustic Radial Light -->
    <radialGradient id="causticGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#FF7A6B" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D73B2C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#70120B" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Shadow for Floating Glass -->
    <filter id="glassDropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#80150B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Frosted Glass Monogram Emboss Filter -->
    <filter id="chiseledGlass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4A0803" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Floating Glass Ambient Shadow -->
  <rect x="22" y="32" width="468" height="468" rx="112" fill="#000000" opacity="0.22" filter="blur(18px)"/>

  <!-- Liquid Glass Base Body -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#glassBodyGrad)" filter="url(#glassDropShadow)"/>

  <!-- Lower Glass Internal Caustic Light Diffusion -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="url(#causticGlow)"/>

  <!-- Specular Curved Glass Reflection (Apple-style Gloss Arc) -->
  <path d="M 16 122 C 16 63 63 16 122 16 L 390 16 C 449 16 496 63 496 122 L 496 230 C 370 290 142 290 16 230 Z" fill="url(#specularGloss)"/>

  <!-- Refractive Outer Glass Prism Rim -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="104.5" fill="none" stroke="url(#glassPrismBevel)" stroke-width="3"/>

  <!-- Inner Subtle Glass Inset Hairline -->
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Frosted Hanko Double-Frame (Inner Box) -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="#FAF8F5" stroke-width="14" stroke-opacity="0.94"/>
  <rect x="67" y="67" width="378" height="378" rx="58" fill="none" stroke="#FAF8F5" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Classical Tenkoku Corner Accents -->
  <circle cx="56" cy="56" r="4.5" fill="#FAF8F5" opacity="0.85"/>
  <circle cx="456" cy="56" r="4.5" fill="#FAF8F5" opacity="0.85"/>
  <circle cx="56" cy="456" r="4.5" fill="#FAF8F5" opacity="0.85"/>
  <circle cx="456" cy="456" r="4.5" fill="#FAF8F5" opacity="0.85"/>

  <!-- Chiseled Frosted Calligraphic Monogram "ထက်" -->
